<div class="container">
    <div class="contact-card">
        <div class="form-wrapper">
            <div class="header">
                <h2>Contact Us</h2>
            </div>
            <form >
                <div class="input-row">
                    <div class="input-group">
                        <label for="name">What is your name?</label>
                        <input type="text" id="name" [(ngModel)]="name" placeholder="Inserisci il tuo nome">
                    </div>
                    <div class="input-group margin">
                        <label for="email">What is your email?</label>
                        <input type="email" id="email" [(ngModel)]="email" placeholder="E-Mail">
                    </div>
                </div>
                <div class="input-group message">
                    <label for="message">How can we help you?</label>
                    <textarea type="text" id="message" [(ngModel)]="message" placeholder="Messaggio"></textarea>
                </div>
                <div class="checkEndButtonContainer">
                    <div class="checkbox">
                        <input type="checkbox" id="privacy" name="privacy" [(ngModel)]="isCheckboxChecked">
                        <label for="privacy">I have read and accept the <a href="#privacy-policy">Privacy Policy.</a></label>
                    </div>
                    <div *ngIf="showError" class="error-message">
                        You must accept the Privacy Policy to send the message.
                    </div>
                    <div class="button-wrapper" (click)="onSubmit(submitBtn)">
                        <label for="submit-form" class="submit-text">{{ isSubmitted ? 'INVIATO' : 'INVIA' }}</label>
                        <button #submitBtn id="submit-form" class="submit-button" type="submit" [disabled]="!isCheckboxChecked"></button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
